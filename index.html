<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#231d2b">
<title>Ratio Chronicle - 균형의 조각을 찾아서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2a2433;--ink2:#4d4456;--ink3:#7a6f80;
  --paper:#e9e2cc;--paper2:#ddd3b8;--paper3:#f3eedd;
  --gold:#e3a63b;--gold2:#c98a22;--teal:#1f6d74;--teal2:#2b8990;--violet:#7a3d9e;
  --hp:#d9475a;--mp:#3a7fd0;--exp:#e7b94a;--ok:#3d8a57;--bad:#c0413c;
  --night:#231d2b;
  --f-title:'Black Han Sans','Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Gowun Dodum','Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --r1:255px 15px 225px 15px/15px 225px 15px 255px;
  --r2:15px 255px 15px 225px/225px 15px 255px 15px;
  --r3:22px 14px 26px 12px/14px 24px 12px 22px;
  --grain:none;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--f-body);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
input,select,textarea{-webkit-user-select:text;user-select:text;font-family:var(--f-body);font-size:16px;color:var(--ink)}
button{font-family:var(--f-body);cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;background:#2a2433}
#ui{position:fixed;inset:0;z-index:5;pointer-events:none}
#ui .live{pointer-events:auto}
.hide{display:none!important}

/* 화면 공통 */
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:max(18px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));pointer-events:auto}
.screen.dim{background:rgba(26,20,32,.55)}
.paper{position:relative;background-color:var(--paper);background-image:var(--grain);border:2.5px solid var(--ink);border-radius:var(--r3);box-shadow:3px 4px 0 rgba(42,36,51,.9),0 24px 50px rgba(15,10,20,.45);padding:24px 24px 20px}
.paper.tilt{transform:rotate(-.4deg)}
h1,h2,h3,.title-font{font-family:var(--f-title);font-weight:400;letter-spacing:.01em;line-height:1.15}
h2{font-size:26px;margin-bottom:6px}
h3{font-size:19px;margin-bottom:6px}
.sub{color:var(--ink2);font-size:14.5px;line-height:1.55}
.small{font-size:13px;color:var(--ink2);line-height:1.5}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1}
.mt{margin-top:14px}.mt2{margin-top:22px}.mb{margin-bottom:12px}

/* 버튼: 손으로 그린 테두리 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:9px 18px;border:2.5px solid var(--ink);border-radius:var(--r1);background:var(--paper3);font-size:16px;font-weight:700;box-shadow:2px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translate(2px,3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--teal);color:#f6f1e2}
.btn.gold{background:var(--gold)}
.btn.danger{background:var(--bad);color:#fff6ef}
.btn.ghost{background:transparent;box-shadow:none;border-style:dashed}
.btn.small{min-height:34px;padding:5px 12px;font-size:14px;box-shadow:1px 2px 0 var(--ink)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.linkbtn{background:none;border:none;color:var(--teal);text-decoration:underline;text-underline-offset:3px;font-size:14.5px;padding:6px}

/* 입력칸: 공책에 쓰는 느낌의 밑줄 */
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:12px}
.field label{font-size:13.5px;color:var(--ink2);font-weight:700}
.field input,.field select{background:transparent;border:none;border-bottom:2px solid var(--ink);border-radius:0 0 30px 4px/0 0 3px 2px;padding:8px 2px 6px;outline:none;min-height:40px}
.field input:focus{border-bottom-color:var(--teal);background:rgba(31,109,116,.06)}
.field .msg{font-size:12.5px;min-height:16px;color:var(--ink3)}
.field .msg.bad{color:var(--bad)}.field .msg.good{color:var(--ok)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.5;color:var(--ink2);margin:6px 0 10px}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--teal)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:6px 0;line-height:1.45}

/* 인증 카드와 책갈피 탭 */
.authwrap{width:min(420px,96vw);margin:auto}
.bookmarks{display:flex;gap:6px;padding-left:18px;margin-bottom:-3px;position:relative;z-index:2}
.bookmark{border:2.5px solid var(--ink);border-bottom:none;border-radius:14px 10px 0 0;padding:9px 18px 8px;background:var(--paper2);font-size:15.5px;font-weight:700;color:var(--ink2);transform:translateY(6px);transition:transform .15s}
.bookmark.on{background:var(--paper);color:var(--ink);transform:translateY(0)}
.bookmark.on.t{background:#cfe0d8}
.authwrap .paper{border-radius:6px 20px 22px 18px/16px 18px 20px 14px}

/* 타이틀 */
.titlebox{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;width:min(640px,94vw)}
.logo{font-family:var(--f-title);font-size:clamp(46px,9vw,92px);color:#f7efd9;line-height:.95;text-shadow:3px 4px 0 var(--ink),0 0 30px rgba(227,166,59,.35);letter-spacing:-.01em}
.logo small{display:block;font-family:var(--f-body);font-size:clamp(15px,2.6vw,20px);color:#f1e3c2;text-shadow:1px 2px 0 var(--ink);margin-top:14px;letter-spacing:.02em}
.brush{display:block;margin:6px auto 0;width:min(420px,70vw);height:22px}
.titlebtns{display:flex;gap:14px;justify-content:center;margin-top:30px;flex-wrap:wrap}
.titlebtns .btn{min-width:150px;font-size:18px;min-height:52px}
.corner{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;color:#d8ccb0;font-size:12.5px;pointer-events:auto}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1.5px solid currentColor;border-radius:var(--r1);font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}

/* 아이콘 버튼 */
.ibtn{width:44px;height:44px;border:2.3px solid var(--ink);border-radius:var(--r1);background:rgba(233,226,204,.92);box-shadow:1px 2px 0 var(--ink);display:inline-flex;align-items:center;justify-content:center;padding:0;position:relative}
.ibtn svg{width:24px;height:24px;stroke:var(--ink);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:translate(1px,2px);box-shadow:none}
.ibtn .pip{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--hp);border:2px solid var(--ink)}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#hud .live{pointer-events:auto}
.stat{position:absolute;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));display:flex;gap:9px;align-items:center;padding:6px 12px 7px 6px;background:rgba(233,226,204,.9);border:2.3px solid var(--ink);border-radius:var(--r3);box-shadow:2px 3px 0 rgba(42,36,51,.85)}
.stat canvas{width:46px;height:46px}
.stat .nm{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:baseline;white-space:nowrap}
.stat .lv{font-family:var(--f-title);font-size:15px;color:var(--teal)}
.bar{width:132px;height:12px;border:2px solid var(--ink);border-radius:8px 3px 9px 4px/4px 8px 3px 9px;background:#f6f0de;overflow:hidden;position:relative;margin-top:3px}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .18s}
.bar.hp i{background:linear-gradient(#ea6d7a,var(--hp))}.bar.mp i{background:linear-gradient(#69a3e3,var(--mp))}
.bar span{position:absolute;inset:0;font-size:9.5px;line-height:9px;text-align:center;font-weight:700;color:#2a2433;text-shadow:0 0 2px #fff}
.buffs{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 70px);left:max(12px,env(safe-area-inset-left));display:flex;gap:5px}
.buff{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;position:relative;background:#f2e8c9}
.buff.bad{background:#d8c3e6}
.buff b{position:absolute;bottom:-12px;font-size:9.5px;color:#f5ecd6;text-shadow:0 1px 2px #000;white-space:nowrap}
.tr{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;gap:7px;align-items:center}
.money{display:flex;gap:10px;align-items:center;padding:5px 12px;background:rgba(233,226,204,.9);border:2.3px solid var(--ink);border-radius:var(--r2);font-weight:700;font-size:14.5px;box-shadow:1px 2px 0 rgba(42,36,51,.85)}
.money i{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--gold);margin-right:4px;vertical-align:-2px}
.money i.gem{border-radius:3px 9px 3px 9px;background:#7fc9d9;transform:rotate(45deg) scale(.85)}
.quest{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 54px);right:max(10px,env(safe-area-inset-right));max-width:260px;padding:7px 11px 8px;background:rgba(35,29,43,.72);color:#f2e9d2;border-radius:var(--r3);font-size:13px;line-height:1.45;border:1.5px solid rgba(242,233,210,.35)}
.quest b{color:var(--gold);font-weight:700;display:block;font-size:12.5px}
.quest.min .qd{display:none}
.expbar{position:absolute;left:0;right:0;bottom:0;height:7px;background:rgba(35,29,43,.75);border-top:1.5px solid rgba(42,36,51,.9)}
.expbar i{position:absolute;inset:0;background:linear-gradient(90deg,#d8a43a,#f1d07a);transform-origin:left}
.expbar span{position:absolute;right:8px;bottom:9px;font-size:11px;color:#f2e9d2;text-shadow:0 1px 2px #000}
.mapname{position:absolute;top:22%;left:50%;transform:translateX(-50%);text-align:center;color:#f8f0dc;text-shadow:2px 3px 0 var(--ink);font-family:var(--f-title);font-size:34px;opacity:0;transition:opacity .6s;white-space:nowrap}
.mapname small{display:block;font-family:var(--f-body);font-size:15px;margin-top:4px}
.mapname.on{opacity:1}
.prompt{position:absolute;transform:translate(-50%,-100%);padding:3px 10px;border:2px solid var(--ink);border-radius:var(--r1);background:var(--paper3);font-size:13px;font-weight:700;white-space:nowrap;box-shadow:1px 2px 0 var(--ink)}
.bossbar{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(520px,50vw);text-align:center;color:#f6eedb;text-shadow:1px 2px 0 var(--ink)}
.bossbar .bar{width:100%;height:14px;margin-top:3px}
.bossbar .bar i{background:linear-gradient(#a65bd0,#6f2f96)}
.bossbar .nm{font-family:var(--f-title);font-size:18px}
.qbanner{position:absolute;top:calc(max(14px,env(safe-area-inset-top)) + 52px);left:50%;transform:translateX(-50%);max-width:min(560px,92vw);padding:9px 16px;background:rgba(233,226,204,.95);border:2.5px solid var(--ink);border-radius:var(--r3);box-shadow:2px 3px 0 var(--ink);text-align:center;font-size:15px;line-height:1.45}
.qbanner b{font-family:var(--f-title);font-size:21px;font-weight:400;display:block;margin:2px 0}
.qbanner .h{font-size:13px;color:var(--violet)}

/* 터치 조작 */
#touch{position:absolute;inset:0;pointer-events:none}
.joy{position:absolute;left:max(22px,env(safe-area-inset-left));bottom:max(26px,env(safe-area-inset-bottom));width:138px;height:138px;border:2.5px solid rgba(42,36,51,.85);border-radius:var(--r1);background:rgba(233,226,204,.28);pointer-events:auto;touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border:2.5px solid var(--ink);border-radius:var(--r2);background:rgba(233,226,204,.85);box-shadow:1px 2px 0 var(--ink)}
.pad{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:250px;height:210px;pointer-events:none}
.tb{position:absolute;pointer-events:auto;touch-action:none;border:2.5px solid var(--ink);border-radius:var(--r1);background:rgba(233,226,204,.82);box-shadow:1px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;overflow:hidden}
.tb svg{width:58%;height:58%;stroke:var(--ink);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tb img{width:78%;height:78%;pointer-events:none}
.tb.on{transform:translate(1px,2px);box-shadow:none;background:rgba(227,166,59,.9)}
.tb .cd{position:absolute;inset:0;background:conic-gradient(rgba(35,29,43,.62) var(--p,0%),transparent 0)}
.tb.atk{width:84px;height:84px;right:0;bottom:0}
.tb.jmp{width:64px;height:64px;right:96px;bottom:0}
.tb.s0{width:52px;height:52px;right:6px;bottom:98px}.tb.s1{width:52px;height:52px;right:66px;bottom:84px}
.tb.s2{width:52px;height:52px;right:120px;bottom:72px}.tb.s3{width:52px;height:52px;right:174px;bottom:20px}
.tb.pot{width:44px;height:44px;right:176px;bottom:84px}
.tb.up{width:48px;height:48px;right:12px;bottom:160px}
.joysize-s .joy{width:112px;height:112px}.joysize-s .joy i{width:48px;height:48px;margin:-24px 0 0 -24px}
.joysize-l .joy{width:168px;height:168px}.joysize-l .joy i{width:70px;height:70px;margin:-35px 0 0 -35px}

/* 모달 */
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(26,20,32,.5);pointer-events:auto;padding:14px;z-index:20}
.modal .paper{width:min(var(--mw,560px),96vw);max-height:min(88vh,760px);display:flex;flex-direction:column;padding:18px 18px 16px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.mhead h2{font-size:23px;margin:0}
.mbody{overflow:auto;flex:1;padding:2px 4px 4px 2px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.xbtn{width:38px;height:38px;border:2.3px solid var(--ink);border-radius:var(--r2);background:var(--paper3);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;flex:none}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;border-bottom:2px solid var(--ink);padding-left:4px}
.tab{border:2px solid var(--ink);border-bottom:none;border-radius:10px 8px 0 0;padding:6px 12px;background:var(--paper2);font-size:14px;font-weight:700;color:var(--ink2);margin-bottom:-2px}
.tab.on{background:var(--paper);color:var(--ink)}

/* 아이템/스킬 목록 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.slot{position:relative;aspect-ratio:1;border:2px solid var(--ink);border-radius:var(--r3);background:var(--paper3);display:flex;align-items:center;justify-content:center;padding:4px}
.slot img{width:86%;height:86%}
.slot .n{position:absolute;right:4px;bottom:1px;font-size:12px;font-weight:700;text-shadow:0 0 3px #fff}
.slot.sel{background:#f1d796;box-shadow:inset 0 0 0 2px var(--gold2)}
.slot .eq{position:absolute;left:3px;top:2px;font-size:10px;background:var(--teal);color:#fff;border-radius:6px;padding:0 4px}
.detail{margin-top:12px;padding:12px;border:2px dashed var(--ink3);border-radius:var(--r3);min-height:84px}
.detail .nm{font-family:var(--f-title);font-size:19px}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:center;padding:8px 10px;border:2px solid var(--ink);border-radius:var(--r3);background:var(--paper3)}
.li img{width:44px;height:44px;flex:none}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:15px}
.li .t span{font-size:12.5px;color:var(--ink2);line-height:1.4;display:block}
.li.locked{opacity:.55}
.price{font-weight:700;white-space:nowrap;font-size:14px}
.equipbox{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.equipbox canvas{width:110px;height:110px;border:2px solid var(--ink);border-radius:var(--r3);background:#d6e2c9}
.eqslots{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;flex:1}
.eqs{display:flex;gap:6px;align-items:center;border:2px solid var(--ink);border-radius:var(--r3);padding:4px 6px;background:var(--paper3);font-size:12.5px;min-height:46px}
.eqs img{width:34px;height:34px}
.statline{font-size:13px;color:var(--ink2);line-height:1.6}

/* 대화창 */
.dialog{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(760px,94vw);display:flex;gap:14px;align-items:flex-start;padding:14px 16px 12px;pointer-events:auto;z-index:15}
.dialog canvas{width:84px;height:84px;flex:none;border:2px solid var(--ink);border-radius:var(--r3);background:#dfe8cf}
.dialog .who{font-family:var(--f-title);font-size:18px;color:var(--teal)}
.dialog .txt{font-size:16.5px;line-height:1.6;margin-top:4px;min-height:52px}
.dialog .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}

/* 수학 문제 */
.mathp{--mw:540px}
.mathp .story{font-size:15px;line-height:1.65;color:var(--ink2);margin-bottom:10px}
.mathp .q{font-size:19px;line-height:1.55;font-weight:700;padding:12px 14px;background:var(--paper3);border:2px solid var(--ink);border-radius:var(--r3)}
.mathp .q .big{font-family:var(--f-title);font-weight:400;font-size:28px;display:block;text-align:center;margin:6px 0 2px;letter-spacing:.04em}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.choices .btn{font-size:19px;min-height:52px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.keypad .btn{min-height:48px;font-size:20px}
.ansbox{margin-top:12px;text-align:center;font-family:var(--f-title);font-size:30px;min-height:44px;border-bottom:2.5px solid var(--ink);border-radius:0 0 40px 6px/0 0 4px 3px}
.hint{margin-top:12px;padding:10px 12px;border-left:4px solid var(--violet);background:rgba(122,61,158,.08);font-size:14.5px;line-height:1.6;border-radius:4px}
.fb{font-family:var(--f-title);font-size:24px;text-align:center;margin-top:10px;min-height:30px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}

/* 토스트 */

function pubUser(r) { const o = Object.assign({}, r); delete o.pw; delete o.salt; delete o.vcode; return o; }

const FIRESTORE_RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{db}/documents {
    function signedIn() { return request.auth != null; }
    function devEmail() { return '__DEV_EMAIL__'; }
    function isDev() { return signedIn() && request.auth.token.email == devEmail() && request.auth.token.email_verified == true; }
    function me() { return get(/databases/$(db)/documents/users/$(request.auth.uid)).data; }
    function isTeacher() { return signedIn() && request.auth.token.email_verified == true && me().role == 'teacher' && me().approved == true; }
    function srv(sid) { return get(/databases/$(db)/documents/servers/$(sid)).data; }

    match /ids/{id} {
      allow read: if true;
      allow create: if signedIn() && request.resource.data.uid == request.auth.uid
        && request.resource.data.keys().hasOnly(['uid', 'email', 'role'])
        && (id != 'seojoonerang' || request.auth.token.email == devEmail());
    }
    match /users/{uid} {
      allow read: if signedIn();
      allow create: if signedIn() && request.auth.uid == uid
        && (request.resource.data.approved == false
            || (request.resource.data.role == 'dev' && request.auth.token.email == devEmail()));
      allow update: if isDev() || (signedIn() && request.auth.uid == uid
        && !request.resource.data.diff(resource.data).affectedKeys().hasAny(['approved', 'role', 'key', 'sid', 'schoolKey']));
    }
    match /servers/{sid} {
      allow read: if signedIn();
      allow create: if isDev() || (isTeacher() && me().key in request.resource.data.admins);
      allow update, delete: if isDev() || (isTeacher() && me().key in resource.data.admins);
    }
    match /saves/{uid} {
      allow read: if signedIn() && (request.auth.uid == uid || isTeacher() || isDev());
      allow write: if signedIn() && request.auth.uid == uid;
    }
    match /inbox/{key}/items/{eid} {
      allow read, update: if signedIn() && me().key == key;
      allow create: if isTeacher() || isDev()
        || (signedIn() && me().role == 'student' && me().key in srv(me().sid).studentAdmins
            && request.resource.data.kind in ['buff', 'msg']);
    }
    match /logs/{lid} {
      allow create: if signedIn();

const SERVER_GS = "/* =====================================================================\n   Ratio Chronicle 서버 (구글 시트 + Apps Script)\n   ---------------------------------------------------------------------\n   1) 구글 시트를 새로 만들고  확장 프로그램 > Apps Script  를 열어요.\n   2) 원래 있던 코드를 지우고 이 파일 내용을 전부 붙여 넣은 뒤 저장해요.\n   3) 배포 > 새 배포 > 유형 선택(톱니) > 웹 앱\n        실행 사용자: 나   /   액세스 권한이 있는 사용자: 모든 사용자\n      배포 > 권한 검토 > 계정 선택 > 고급 > (안전하지 않음)으로 이동 > 허용\n   4) 나온 웹 앱 URL(…/exec)을 게임 파일 맨 위 RC_SERVER 따옴표 안에 붙여 넣어요.\n   시트에 accounts(계정), saves(저장 + 랭킹) 탭이 자동으로 생겨요.\n   비밀번호는 원문이 아니라 기기에서 한 번, 서버에서 다시 소금을 쳐서 암호화한 값만 저장돼요.\n   ===================================================================== */\nconst DEV_ID = 'seojoonerang';          // 개발자 아이디\nconst DEV_CODE = 'ratio-dev-2026';      // 개발자 코드 (게임 파일의 CONFIG.DEV_CODE 와 같아야 해요)\nconst TOKEN_DAYS = 30;                  // 자동 로그인 유지 기간(일)\nconst ACC = ['id', 'name', 'role', 'salt', 'hash', 'token', 'tokenAt', 'fails', 'lockUntil', 'created', 'lastLogin', 'sess'];\nconst SAV = ['id', 'name', 'cls', 'level', 'exp', 'correct', 'total', 'first', 'tower', 'world', 'updated', 'save'];\n\nfunction doGet() { return out_({ ok: true, server: 'Ratio Chronicle', time: Date.now() }); }\nfunction doPost(e) {\n  let q;\n  try { q = JSON.parse(e.postData.contents); } catch (err) { return out_({ ok: false, err: '잘못된 요청이에요.' }); }\n  const fn = OPS[q && q.op];\n  if (!fn) return out_({ ok: false, err: '알 수 없는 요청이에요.' });\n  try { return out_(Object.assign({ ok: true }, fn(q))); }\n  catch (err) { return out_({ ok: false, err: String((err && err.message) || err), auth: !!(err && err.auth) }); }\n}\nfunction out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }\nfunction sheet_(name, head) {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  let s = ss.getSheetByName(name);\n  if (!s) {\n    s = ss.insertSheet(name);\n    s.getRange('A:A').setNumberFormat('@');\n    s.getRange(1, 1, 1, head.length).setValues([head]).setFontWeight('bold');\n    s.setFrozenRows(1);\n  }\n  return s;\n}\nfunction setting_(key) {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  let s = ss.getSheetByName('settings');\n  if (!s) { s = ss.insertSheet('settings'); s.getRange(1, 1, 3, 2).setValues([['설정', '값'], ['joinCode', ''], ['도움말', 'joinCode 옆 칸에 입장 코드를 적으면 가입할 때 그 코드가 필요해요. 비워 두면 누구나 가입할 수 있어요.']]); s.getRange('B:B').setNumberFormat('@'); s.setFrozenRows(1); }\n  const v = s.getRange(1, 1, Math.max(1, s.getLastRow()), 2).getValues();\n  for (const r of v) if (String(r[0]).trim() === key) return String(r[1] == null ? '' : r[1]).trim();\n  return '';\n}\nfunction find_(s, id) {\n  if (s.getLastRow() < 2) return 0;\n  const c = s.getRange(2, 1, s.getLastRow() - 1, 1).createTextFinder(id).matchCase(true).matchEntireCell(true).findNext();\n  return c ? c.getRow() : 0;\n}\nfunction row_(s, r, head) { const v = s.getRange(r, 1, 1, head.length).getValues()[0], o = {}; head.forEach((k, i) => o[k] = v[i]); return o; }\nfunction put_(s, r, head, o) { s.getRange(r, 1, 1, head.length).setValues([head.map(k => o[k] === undefined || o[k] === null ? '' : o[k])]); }\nfunction add_(s, head, o) { const r = s.getLastRow() + 1; put_(s, r, head, o); return r; }\nfunction lock_(f) { const L = LockService.getScriptLock(); L.waitLock(20000); try { return f(); } finally { L.releaseLock(); } }\nfunction err_(msg, auth) { const e = new Error(msg); if (auth) e.auth = true; return e; }\nfunction nid_(id) { id = String(id || '').trim().toLowerCase(); if (!/^[a-z0-9_]{4,16}$/.test(id)) throw err_('아이디는 영문, 숫자, _ 로 4~16자예요.'); return id; }\nfunction clean_(t) { return String(t == null ? '' : t).replace(/[\\u0000-\\u001f]/g, '').trim(); }\nfunction safe_(t) { t = clean_(t); return /^[=+\\-@]/.test(t) ? \"'\" + t : t; }\nfunction unsafe_(t) { return String(t == null ? '' : t).replace(/^'/, ''); }\nfunction hash_(salt, pw) { let h = salt + '|' + pw; for (let i = 0; i < 200; i++) h = Utilities.b   AU.play('title');
  let me = null; try { me = await API.me(); } catch (e) { }
  if (me) routeUser(me); else scrTitle();
}
boot();

</script>
